<div style="font-family:Archivo,system-ui,sans-serif;color:#201e1d">
  <div style="background:#201e1d;color:#f3f2f2">
    <div style="max-width:1440px;margin:0 auto;padding:0 clamp(16px,4vw,40px);display:flex;align-items:center;gap:16px;min-height:34px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase">
        <span>Gizli paketleme</span>
        <span style="opacity:.35">/</span>
        <span>Aynı gün kargo</span>
        <span style="opacity:.35">/</span>
        <span>3D Secure</span>
      </div>
      <button type="button" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:#f3f2f2;font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:6px 0" style-hover="color:#ff9783">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.73 5.08a10.74 10.74 0 0 1 11.2 6.57 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-1.44 2.49"></path><path d="M14.08 14.16a3 3 0 0 1-4.24-4.24"></path><path d="M17.48 17.5a10.75 10.75 0 0 1-15.42-5.15 1 1 0 0 1 0-.7 10.75 10.75 0 0 1 4.45-5.14"></path><path d="m2 2 20 20"></path></svg>
        Hızlı çıkış

    </div>
  </div>

  <header style="background:#f3f2f2;border-bottom:2px solid rgba(32,30,29,.4)">
    <div style="max-width:1440px;margin:0 auto;padding:14px clamp(16px,4vw,40px);display:flex;align-items:center;gap:clamp(12px,3vw,32px)">
      <a href="01 Anasayfa.dc.html" style="font-weight:800;font-size:clamp(19px,2.4vw,24px);letter-spacing:-.03em;flex:none;text-decoration:none;color:#201e1d">ozmishop<span style="color:#ec3013">.</span></a>

      <label style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;border-bottom:2px solid rgba(32,30,29,.4);padding:6px 2px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;opacity:.55"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" placeholder="Ürün, marka veya kategori ara" style="flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;color:#201e1d;outline:none">
      </label>

      <div style="display:flex;align-items:center;gap:4px;flex:none">
        <a href="06 Hesabim.dc.html" title="Hesabım" style="width:38px;height:38px;display:grid;place-items:center;color:#201e1d" style-hover="background:rgba(32,30,29,.07)">

        <a href="06 Hesabim.dc.html" title="Favorilerim" style="width:38px;height:38px;display:grid;place-items:center;color:#201e1d" style-hover="background:rgba(32,30,29,.07)">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
        </a>
        <a href="05 Sepet ve Odeme.dc.html" title="Sepetim" style="position:relative;display:inline-flex;align-items:center;gap:8px;background:#201e1d;color:#f3f2f2;padding:9px 14px;text-decoration:none" style-hover="background:#ec3013">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          <span style="font-weight:800;font-size:13px;letter-spacing:.02em">{{ cart }}</span>
        </a>

    </div>

    <nav style="border-top:1px solid rgba(32,30,29,.22);overflow-x:auto;scrollbar-width:none">

        <sc-for list="{{ cats }}" as="cat" hint-placeholder-count="8">
          <a href="02 Kategori.dc.html" style="padding:11px 14px 11px 0;margin-right:14px;font-size:13px;letter-spacing:.01em;text-decoration:none;color:#201e1d;border-bottom:2px solid transparent" style-hover="border-bottom-color:#ec3013;color:#ec3013">{{ cat }}</a>
        </sc-for>
        <a href="02 Kategori.dc.html" style="padding:11px 14px 11px 0;font-size:13px;font-weight:800;color:#ec3013;letter-spacing:.01em;text-decoration:none;border-bottom:2px solid transparent" style-hover="border-bottom-color:#ec3013">Fırsatlar</a>
      </div>
    </nav>
  </header>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;cart&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      cart: this.props.cart ?? '2',
      cats: ['Vibratörler', 'Masaj & dokunma', 'Kayganlaştırıcılar', 'Çiftlere özel', 'İç giyim', 'Prezervatif', 'Bakım & hijyen', 'Hediye setleri']
    };
  }
}

</script>
